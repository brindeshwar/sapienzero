name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (reproduce locally with python -m ruff check . --config ruff.toml)
        run: ruff check . --config ruff.toml

  # One stable required check. Branch protection requires only this (and "docs"), so jobs can be added, renamed or
  # skipped by path filters without leaving a required check that never reports. See docs/06-process/ci-cd.md.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "lint: ${{ needs.lint.result }}"
          test "${{ needs.lint.result }}" = "success"
